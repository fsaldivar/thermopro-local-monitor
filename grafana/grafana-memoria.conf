# Instalar en /etc/systemd/system/grafana-server.service.d/memoria.conf
#
# Sin esto Grafana crece sin tope. En una Raspberry Pi 3 (905 MB) con el swap
# en zram, las paginas comprimidas siguen ocupando esa misma RAM: cuanto mas
# swapea, menos memoria libre queda y mas necesita swapear. El sistema no
# llega a morir -responde a ping y acepta TCP- pero deja de poder hacer fork,
# asi que mata cada sesion SSH nueva al instante y se vuelve indiagnosticable.
[Service]
MemoryAccounting=yes
MemoryHigh=300M
MemoryMax=400M
# Si hay que matar a alguien por falta de memoria, que sea este.
OOMScoreAdjust=600
